# Publica en GitHub Pages los cuadernos Pluto exportados a HTML.
# Origen: legacy/neurosmart/docs (antes, la web de me1catrr/NeuroSmart-EEG).
# Requiere Settings → Pages → Source: «GitHub Actions».
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "legacy/neurosmart/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy/neurosmart/docs
      - id: deployment
        uses: actions/deploy-pages@v4
