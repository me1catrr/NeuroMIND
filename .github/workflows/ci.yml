# =========================
# NeuroMIND — CI (GitHub Actions)
# =========================
# Reproduce las comprobaciones que AGENTS.md (§12) exige antes de fusionar
# en main: repositorio sin datos, syntax check del módulo y suite completa.
#
# Los tests de regresión con el dataset real leen results/ (gitignored); en
# CI no existe, así que esos @testset se registran como skipped por diseño.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Manifest.toml está resuelto con Julia 1.12.
        julia-version: ['1.12']

    steps:
      - uses: actions/checkout@v4

      # AGENTS.md §8: nunca versionar datos, resultados ni configuración local.
      - name: Repositorio sin datos
        run: |
          # data, results y mne_brain/results son enlaces simbólicos locales:
          # ni el enlace ni su contenido se versionan.
          if git ls-files | grep -E '(^(data|results|mne_brain/results|deprecated/results)(/|$)|\.DS_Store$|^\.claude/|^\.vscode/)'; then
            echo "::error::Hay archivos que no deben versionarse (ver AGENTS.md §8)"
            exit 1
          fi

      # AGENTS.md §8: el mismo control que el hook pre-commit, sobre todo el árbol.
      # Falla si hay nombres de archivo crudos de la adquisición, formatos EEG o
      # clínicos, o PDFs fuera de docs/. Solo informa de rutas y recuentos.
      - name: Auditoría de identificadores
        run: bash scripts/hooks/pre-commit --all

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - name: Syntax check
        run: julia --project=. -e 'include("src/NeuroMIND.jl"); println("OK")'

      - name: Tests
        run: julia --project=. test/runtests.jl
