# NeuroMIND — Configuración para análisis de UN solo sujeto
# Primer caso funcional: sub-M05, ses-T2, tarea eyesclosed
#
# Uso: julia --project=. scripts/run_single_subject.jl

# ─── Identificación del sujeto ────────────────────────────────
[subject]
subject_id = "auto"      # "auto" = primer sujeto detectado en data/BIDS/raw/
session_id = "T2"        # Sesión a procesar
task       = "eyesclosed"
run        = 1

# ─── Parámetros de grabación ──────────────────────────────────
[recording]
sampling_rate = 500.0    # Hz (leído de metadata si está disponible)

# ─── Filtrado ─────────────────────────────────────────────────
# profile = "eeg_julia"  → orden y parámetros idénticos a EEG_Julia/src/Preprocessing/filtering.jl
#   Cadena: Notch(filt) → Bandreject(filt) → Highpass(filtfilt) → Lowpass(filtfilt)
# profile = "default"    → orden legacy: Highpass(filtfilt) → Lowpass(filtfilt) → Notch(filtfilt) → Bandreject(filtfilt)
[filtering]
profile          = "eeg_julia"
highpass_hz      = 0.5          # EEG_Julia: Highpass_cutoff = 0.5, order_design = 4
lowpass_hz       = 150.0        # EEG_Julia: Lowpass_cutoff = 150, order_design = 4
notch_hz         = 50.0         # EEG_Julia: Notch_cutoff = 50, order = 4
notch_bw_hz      = 1.0          # EEG_Julia: Notch_width = 1.0  (→ 49.5–50.5 Hz)
bandreject_lo    = 99.5         # EEG_Julia: Bandreject_freq=100, bw=1.0 → 99.5–100.5 Hz
bandreject_hi    = 100.5        # EEG_Julia: mismo
filter_order     = 4            # EEG_Julia: Notch_order=4, Bandreject_order=4, HP/LP order_design=4

# ─── ICA ──────────────────────────────────────────────────────
# profile = "eeg_julia" → n_components=n_channels, max_iter=512, tol=1e-7, seed=1234 (EEG_Julia exacto)
# profile = "default"   → reducido, configurable con los parámetros de abajo
[ica]
profile      = "eeg_julia"
n_components = 0          # 0 = "auto" = todos los canales (solo usado con profile=default)
max_iter     = 512
tol          = 1e-7
seed         = 1234
artifact_threshold = 1.5  # umbral de score para clasificación automática

# ─── Segmentación ─────────────────────────────────────────────
# profile = "eeg_julia" → fuerza epoch_length_s=1.0, overlap=0.0 (EEG_Julia exacto)
# profile = "default"   → usa segment_length_seconds y overlap_seconds de abajo
[segmentation]
profile                = "eeg_julia"
segment_length_seconds = 2.0    # ignorado cuando profile="eeg_julia"
overlap_seconds        = 0.0    # ignorado cuando profile="eeg_julia"
min_segments           = 10     # Mínimo para análisis válido

# ─── Corrección de baseline ───────────────────────────────────
# method = "first_window_mean" → media de [baseline_start_s, baseline_end_s] por canal
#                                 (EEG_Julia: 0.00–0.10 s → muestras 1–50 a 500 Hz)
# method = "mean"              → media de todo el epoch (NeuroMIND default)
# method = "median"            → mediana de todo el epoch
# n_passes = 2                 → doble pasada: antes del AR y después (EEG_Julia exacto)
[baseline]
method           = "first_window_mean"
baseline_start_s = 0.0     # inicio ventana baseline (s)
baseline_end_s   = 0.10    # fin ventana baseline (s)  — EEG_Julia: 0–100 ms
n_passes         = 2       # 1 = solo pre-AR;  2 = pre-AR + post-AR (EEG_Julia exacto)

# ─── Rechazo de artefactos ────────────────────────────────────
# profile = "eeg_julia" → ±70 µV, primeros n_channels_used canales, sin gradiente
# profile = "default"   → amplitude_threshold_uv + gradient_threshold_uv, todos los canales
[artifact_rejection]
profile               = "eeg_julia"
# Parámetros EEG_Julia (activos cuando profile="eeg_julia"):
min_amplitude_uv      = -70.0   # umbral mínimo de amplitud (µV)
max_amplitude_uv      =  70.0   # umbral máximo de amplitud (µV)
n_channels_used       = 30      # solo los primeros N canales para el rechazo
# Parámetros NeuroMIND default (activos cuando profile="default"):
amplitude_threshold_uv = 100.0
gradient_threshold_uv  = 50.0
use_gradient           = true
enabled                = true

# ─── Análisis espectral ───────────────────────────────────────
[spectral]
nfft       = 1024
window_pct = 10.0

# ─── Bandas de frecuencia ─────────────────────────────────────
[bands]
DELTA     = [0.5,  4.0]
THETA     = [4.0,  8.0]
ALPHA     = [7.8, 11.7]
BETA_LOW  = [12.0, 15.0]
BETA_MID  = [15.0, 18.0]
BETA_HIGH = [18.0, 30.0]
GAMMA     = [30.0, 50.0]

# ─── Conectividad ─────────────────────────────────────────────
[connectivity]
filter_order = 8
use_csd      = false     # CSD OPCIONAL — false por defecto para primer caso

# ─── Control de calidad ───────────────────────────────────────
[qc]
bad_channel_zscore_threshold = 3.0

# ─── Rutas ────────────────────────────────────────────────────
[paths]
bids_root = "data/BIDS"
results   = "results"

# ─── Salida ───────────────────────────────────────────────────
[output]
figure_format = "png"
figure_dpi    = 150

# ─── Dashboard ────────────────────────────────────────────────
[dashboard]
port         = 8080
open_browser = true
