[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mne-brain"
version = "0.1.0"
description = "MNE-Python replication pipeline for NeuroMIND/BRAIN EEG analyses."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rafael Castro Triguero" }
]
dependencies = [
  "mne>=1.7",
  "mne-connectivity>=0.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.25",
  "jupyterlab>=4.0",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

