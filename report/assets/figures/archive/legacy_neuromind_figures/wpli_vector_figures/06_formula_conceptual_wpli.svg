<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title>Fórmula conceptual wPLI</title>
<desc>Original vector illustration for LaTeX documents about wPLI functional connectivity in EEG.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#5f6b7a"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#1f5cc4"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#cc1f1a"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef5ff"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="55" y="55" width="1090" height="650" rx="24" fill="white" stroke="#0b1d57" stroke-width="3" filter="url(#shadow)"/><rect x="55" y="55" width="1090" height="64" rx="24" fill="#0b1d57"/><text x="600.0" y="98" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">Fórmula conceptual del wPLI</text><rect x="150" y="190" width="900" height="280" rx="28" fill="white" stroke="#d8e2ef" stroke-width="4"/><text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#6a2dbd" text-anchor="middle">wPLI</text><text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="middle">=  | media de la parte imaginaria |  /  media de su magnitud</text><text x="600" y="520" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0b1d57" text-anchor="middle">0 = sin relación de fase consistente     ·     1 = desfase consistente</text><rect x="210" y="585" width="780" height="70" rx="20" fill="#eef8f1" stroke="#1b7a35" stroke-width="3"/><text x="600" y="630" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#1b7a35" text-anchor="middle">Interpretación: mide consistencia, no causalidad ni dirección</text>
</svg>