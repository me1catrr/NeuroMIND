<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title>Usos wPLI</title>
<desc>Original vector illustration for LaTeX documents about wPLI functional connectivity in EEG.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#5f6b7a"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#1f5cc4"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#cc1f1a"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef5ff"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="55" y="55" width="1090" height="650" rx="24" fill="white" stroke="#0b1d57" stroke-width="3" filter="url(#shadow)"/><rect x="55" y="55" width="1090" height="64" rx="24" fill="#0b1d57"/><text x="600.0" y="98" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">Usos de wPLI en neuroseñales</text><circle cx="150" cy="250" r="72" fill="white" stroke="#1f5cc4" stroke-width="5"/><circle cx="150" cy="230" r="9" fill="#0b1d57"/><circle cx="122" cy="268" r="9" fill="#0b1d57"/><circle cx="178" cy="268" r="9" fill="#0b1d57"/><circle cx="150" cy="285" r="9" fill="#0b1d57"/><path d="M150,230 L122,268 L150,285 L178,268 L150,230" fill="none" stroke="#0b1d57" stroke-width="3"/><text x="150" y="380" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828" text-anchor="middle">Redes cerebrales</text><text x="150" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#5f6b7a" text-anchor="middle">reposo/tareas</text><circle cx="370" cy="250" r="72" fill="white" stroke="#1b7a35" stroke-width="5"/><path d="M330,260 C355,210 385,300 410,240" fill="none" stroke="#6a2dbd" stroke-width="6"/><text x="370" y="380" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828" text-anchor="middle">Comparación</text><text x="370" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#5f6b7a" text-anchor="middle">grupos clínicos</text><circle cx="590" cy="250" r="72" fill="white" stroke="#1f5cc4" stroke-width="5"/><path d="M555,285 C570,215 630,220 625,285" fill="none" stroke="#1b7a35" stroke-width="6"/><circle cx="590" cy="245" r="20" fill="none" stroke="#1b7a35" stroke-width="5"/><text x="590" y="380" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828" text-anchor="middle">Desarrollo</text><text x="590" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#5f6b7a" text-anchor="middle">intervenciones</text><circle cx="810" cy="250" r="72" fill="white" stroke="#1b7a35" stroke-width="5"/><rect x="772" y="220" width="76" height="58" rx="10" fill="none" stroke="#d64a1b" stroke-width="6"/><line x1="790" y1="295" x2="830" y2="295" stroke="#d64a1b" stroke-width="6"/><text x="810" y="380" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828" text-anchor="middle">Neurofeedback</text><text x="810" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#5f6b7a" text-anchor="middle">estimulación</text><circle cx="1030" cy="250" r="72" fill="white" stroke="#1f5cc4" stroke-width="5"/><path d="M995,285 L1065,215" stroke="#cc1f1a" stroke-width="10" stroke-linecap="round"/><path d="M1000,220 L1060,280" stroke="#cc1f1a" stroke-width="10" stroke-linecap="round"/><text x="1030" y="380" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828" text-anchor="middle">Fármacos</text><text x="1030" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#5f6b7a" text-anchor="middle">efectos funcionales</text><text x="600" y="610" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0b1d57" text-anchor="middle">Clave: útil para estudiar sincronización de fase, siempre con buen preprocesado y segmentación</text>
