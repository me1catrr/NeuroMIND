<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title>Número complejo cartesiano</title>
<desc>Ilustración vectorial original para documentos LaTeX sobre números complejos, fase y sincronización EEG.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#5f6b7a"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#1f5cc4"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#cc1f1a"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef5ff"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="55" y="55" width="1090" height="650" rx="24" fill="white" stroke="#0b1d57" stroke-width="3" filter="url(#shadow)"/><rect x="55" y="55" width="1090" height="64" rx="24" fill="#0b1d57"/><text x="600.0" y="98" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">Número complejo: forma cartesiana</text><rect x="115" y="165" width="330" height="420" rx="20" fill="white" stroke="#d8e2ef" stroke-width="3"/><text x="280" y="225" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#0b1d57" text-anchor="middle">z = a + j b</text><text x="150" y="310" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-style="normal" fill="#101828" text-anchor="start">Re{z} = a</text><text x="150" y="365" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-style="normal" fill="#101828" text-anchor="start">Im{z} = b</text><text x="150" y="465" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" font-style="normal" fill="#101828" text-anchor="start">a: parte real</text><text x="150" y="515" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" font-style="normal" fill="#101828" text-anchor="start">b: parte imaginaria</text><text x="150" y="565" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#6a2dbd" text-anchor="start">j² = −1</text>
    <line x1="510.0" y1="430" x2="990.0" y2="430" stroke="#101828" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="750" y1="640.0" x2="750" y2="220.0" stroke="#101828" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1015.0" y="440" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#101828" text-anchor="start">Re</text>
    <text x="760" y="210.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#101828" text-anchor="start">Im</text>
    <line x1="750" y1="430" x2="920" y2="430" stroke="#1f5cc4" stroke-dasharray="8,7" stroke-width="3"/><line x1="920" y1="430" x2="920" y2="280" stroke="#1f5cc4" stroke-dasharray="8,7" stroke-width="3"/><line x1="750" y1="430" x2="920" y2="280" stroke="#1f5cc4" stroke-width="6" marker-end="url(#arrowBlue)"/><circle cx="920" cy="280" r="11" fill="#0b1d57"/><text x="940" y="270" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#101828" text-anchor="start">(a, b)</text><text x="835.0" y="337.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1f5cc4" text-anchor="middle">z</text><text x="920" y="475" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#1f5cc4" text-anchor="middle">a</text><text x="720" y="280" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#1f5cc4" text-anchor="middle">b</text><text x="750" y="650" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#0b1d57" text-anchor="middle">Un número complejo representa un punto y un vector en el plano complejo.</text>
</svg>