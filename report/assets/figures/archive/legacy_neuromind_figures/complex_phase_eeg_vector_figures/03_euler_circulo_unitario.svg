<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title>Euler círculo unitario</title>
<desc>Ilustración vectorial original para documentos LaTeX sobre números complejos, fase y sincronización EEG.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#5f6b7a"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#1f5cc4"/>
  </marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M2,2 L10,6 L2,10 Z" fill="#cc1f1a"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef5ff"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="55" y="55" width="1090" height="650" rx="24" fill="white" stroke="#6a2dbd" stroke-width="3" filter="url(#shadow)"/><rect x="55" y="55" width="1090" height="64" rx="24" fill="#6a2dbd"/><text x="600.0" y="98" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">Ecuación de Euler en el círculo unitario</text>
    <line x1="140.0" y1="390" x2="640.0" y2="390" stroke="#101828" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="390" y1="640.0" x2="390" y2="140.0" stroke="#101828" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="665.0" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#101828" text-anchor="start">Re</text>
    <text x="400" y="130.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#101828" text-anchor="start">Im</text>
    <circle cx="390" cy="390" r="170" fill="white" stroke="#d8e2ef" stroke-width="4"/><line x1="390" y1="390" x2="524.0" y2="285.3" stroke="#6a2dbd" stroke-width="6" marker-end="url(#arrowBlue)"/><line x1="524.0" y1="390" x2="524.0" y2="285.3" stroke="#0b7285" stroke-dasharray="8,7" stroke-width="3"/><line x1="390" y1="285.3" x2="524.0" y2="285.3" stroke="#0b7285" stroke-dasharray="8,7" stroke-width="3"/><path d="M450,390 A60,60 0 0,0 437,353" fill="none" stroke="#d64a1b" stroke-width="5"/><text x="468" y="362" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#d64a1b" text-anchor="middle">φ</text><circle cx="524.0" cy="285.3" r="10" fill="#6a2dbd"/><text x="543.9618281131427" y="275.3375491946381" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" font-style="normal" fill="#6a2dbd" text-anchor="start">e^{jφ}</text><text x="456.98091405657135" y="432" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#0b7285" text-anchor="middle">cos φ</text><text x="568.9618281131427" y="337.66877459731904" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#0b7285" text-anchor="middle">sen φ</text><rect x="690" y="205" width="390" height="350" rx="26" fill="white" stroke="#d8e2ef" stroke-width="3"/><text x="885" y="280" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" font-style="normal" fill="#6a2dbd" text-anchor="middle">e^{jφ}</text><text x="885" y="350" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" font-style="normal" fill="#101828" text-anchor="middle">= cos φ + j sen φ</text><text x="885" y="455" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" font-style="normal" fill="#0b7285" text-anchor="middle">Real → coseno</text><text x="885" y="505" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" font-style="normal" fill="#0b7285" text-anchor="middle">Imaginario → seno</text>
</svg>